# Builds the eight cfCNV containers and pushes them to the GitHub Container Registry:
#   ghcr.io/<owner>/cfcnv-<name>:<version>  and  :latest
# Runs when a Dockerfile changes on main, or by hand (Actions tab -> "Build containers" -> Run workflow).
name: Build containers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (keep in step with params.container_tag in nextflow.config)"
        default: "1.0.0"
  push:
    branches: [main]
    paths: ["containers/**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [cfcnv-tools, cfcnv-r, cfcnv-cnvkit, cfcnv-spectre, cfcnv-fragle, cfcnv-bicseq2, cfcnv-ml, cfcnv-lyceum]
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry names must be lower case)
        id: n
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || '1.0.0' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ steps.n.outputs.owner }}/${{ matrix.image }}:${{ steps.n.outputs.tag }}
            ghcr.io/${{ steps.n.outputs.owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
