# Builds the seven distributable cfCNV containers and pushes them to the GitHub Container Registry:
#   ghcr.io/<owner>/cfcnv-<name>:<version>  and  :latest
# Runs when a Dockerfile changes on main, or by hand (Actions tab -> "Build containers" -> Run workflow).
name: Build containers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (keep in step with params.container_tag in nextflow.config)"
        default: "1.0.0"
  push:
    branches: [main]
    paths: ["containers/**", ".github/workflows/containers.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [cfcnv-tools, cfcnv-r, cfcnv-cnvkit, cfcnv-spectre, cfcnv-fragle, cfcnv-ml, cfcnv-lyceum]
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry names must be lower case)
        id: n
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || '1.0.0' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ steps.n.outputs.owner }}/${{ matrix.image }}:${{ steps.n.outputs.tag }}
            ghcr.io/${{ steps.n.outputs.owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Also publish a ready-made Singularity/Apptainer image (SIF) as tag <version>-sif, so HPC users can download
      # it as one file (singularity pull oras://...) without unpacking layers on their cluster.
      - name: Publish Singularity image (SIF)
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wget -q https://github.com/apptainer/apptainer/releases/download/v1.3.6/apptainer_1.3.6_amd64.deb
          sudo apt-get update -q && sudo apt-get install -y -q ./apptainer_1.3.6_amd64.deb
          export APPTAINER_TMPDIR=$RUNNER_TEMP
          IMG=ghcr.io/${{ steps.n.outputs.owner }}/${{ matrix.image }}
          apptainer build --disable-cache ${{ matrix.image }}.sif docker://$IMG:${{ steps.n.outputs.tag }}
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login --username ${{ github.actor }} --password-stdin oras://ghcr.io
          apptainer push ${{ matrix.image }}.sif oras://$IMG:${{ steps.n.outputs.tag }}-sif
          rm -f ${{ matrix.image }}.sif

  # BIC-seq2 is free for academic use only and its redistribution terms are not stated, so its image is
  # built here only to check the recipe; it is NOT pushed. Users build their own (assets/hpc/README_bicseq2.md).
  # Runs only when started by hand (its download site is currently offline).
  check-bicseq2-recipe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true      # depends on the BIC-seq site being reachable
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: containers/cfcnv-bicseq2
          push: false
